name: Deploy to Cloudflare Workers

# Manual only, deliberately. This app's live origin is still served by the
# OpenAI Sites project in .openai/hosting.json. Until the custom domain is
# repointed at this Worker, running this publishes to the workers.dev URL and
# changes nothing about count-it.backwerdrhythmshop.com. Merging never fires it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-workers-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm check
      # vinext's build emits a complete deploy config at dist/server/wrangler.json
      # — worker name, compatibility flags, main, and the assets directory. There
      # is no hand-maintained wrangler.jsonc to drift from it.
      - name: Deploy
        run: pnpm exec wrangler deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
