<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Count It</title>
  <desc id="desc">A numeral one with a single accent nub beside it</desc>
  <!-- Rhythm and reading family: Brick ground. The shipped mark put a serif "1"
       next to three rising bars; the bars are what fails first at small size.
       One numeral and one nub — the beat and the subdivision after it — is the
       same idea with a third of the parts. Drawn as paths so the icon does not
       depend on a serif face being installed. -->
  <rect width="1024" height="1024" fill="#8b3a3a"/>
  <g fill="#fafaf9">
    <path d="M400 276 L302 348 L302 436 L400 364 Z"/>
    <rect x="400" y="276" width="100" height="420"/>
    <rect x="306" y="676" width="288" height="96" rx="32"/>
  </g>
  <circle cx="752" cy="560" r="82" fill="#e2725b"/>
</svg>
